name: Publica no Instagram

on:
  schedule:
    # a cada 10 minutos; o script so publica o que ja venceu o horario
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # O script comita e empurra o registro ele mesmo (reivindicar/gravarResultado
      # em publica_instagram.js), a cada post, na hora. Isso nao e so estilo: e a
      # trava contra publicar em dobro. Em 20/08/2026 duas execucoes (o cron de
      # 10min e um workflow_dispatch manual) fizeram checkout quase juntas, as
      # duas viram "ainda nao publicado" e postaram o MESMO conteudo duas vezes -
      # so foi possivel porque o commit acontecia so no FIM, depois de publicar.
      # Reivindicar (commitar) ANTES de chamar a API do Instagram fecha essa
      # brecha: quem perde a corrida do commit desiste sem nunca publicar.
      - name: Publicar o que venceu
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: node publica_instagram.js
