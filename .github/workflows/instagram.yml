name: Publica no Instagram

on:
  schedule:
    # a cada 10 minutos; o script so publica o que ja venceu o horario
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publicar o que venceu
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: node publica_instagram.js

      - name: Guardar o que foi publicado
        # sempre roda, mesmo se um item da agenda falhar (aspect ratio, video
        # que nao processa etc). O script salva a cada sucesso e sai com erro
        # se ALGUM item falhou, o que sem isso pulava este passo inteiro e
        # deixava um post que JA publicou de verdade sem registro -> proxima
        # execucao tentava publicar ele de novo, duplicado.
        if: always()
        run: |
          if [ -n "$(git status --porcelain publicados.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add publicados.json
            git commit -m "registra publicacao no instagram"
            git push
          fi
