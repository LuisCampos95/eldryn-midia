name: Verifica nicks Hytale

# Roda a varredura de nicks de 3 caracteres e comita o resultado
# (nicks/nicks_livres.txt, .json e RESULTADO.md) no proprio branch. Roda no
# Actions porque o runner tem rede aberta. A sonda coleta URLs de API do
# proprio hytale.tools (e do pacote/repositorio publico da comunidade) pra
# alimentar a qualificacao de fonte do script - ver verifica_nicks_hytale.js.
on:
  workflow_dispatch:
    inputs:
      charset:
        description: 'letras | numeros | letras+numeros | tudo'
        default: 'letras+numeros'
      max_rps:
        description: 'requisicoes por segundo (educacao com a API)'
        default: '8'
  # Push tambem dispara (so quando o verificador muda), porque o
  # workflow_dispatch de branch novo demora a registrar na API. O commit
  # de resultado vem do GITHUB_TOKEN, que nao redispara workflow.
  push:
    branches:
      - claude/verificar-nicks-3-digitos-hi0md7
    paths:
      - verifica_nicks_hytale.js
      - sonda_rede.js
      - .github/workflows/verifica_nicks.yml

permissions:
  contents: write

concurrency:
  group: verifica-nicks
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Coleta URLs candidatas de API: bundles do hytale.tools (buscando kkk
      # e kry, que viram molde {n}), o pacote pypi hytale-api (cliente do
      # API oficial) e o repositorio publico hytale-tools/api. Tudo termina
      # em sonda_urls.txt; o script qualifica cada uma antes de confiar.
      - name: Sondar fontes
        run: |
          set +e
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          mkdir -p /tmp/sonda && cd /tmp/sonda
          curl -sSL -A "$UA" --max-time 20 'https://hytale.tools/search/kkk' -o pag1.html
          curl -sSL -A "$UA" --max-time 20 'https://hytale.tools/search/kry' -o pag2.html
          curl -sSL -A "$UA" --max-time 20 'https://hytale.tools/search/zqx' -o pag3.html
          {
            echo "== tamanho das paginas =="
            wc -c pag1.html pag2.html pag3.html
            echo "== trechos com available/taken/reserved/status (kkk, reservado) =="
            grep -oE '.{80}(avail|taken|reserv|status)[a-zA-Z]*.{80}' -i pag1.html | head -20
            echo "== trechos com available/taken/reserved/status (zqx, provavel livre) =="
            grep -oE '.{80}(avail|taken|reserv|status)[a-zA-Z]*.{80}' -i pag3.html | head -20
            echo "== __NEXT_DATA__ ou self.__next_f (kkk) =="
            grep -oE '(__NEXT_DATA__|self\.__next_f\.push)[^<]{0,400}' pag1.html | head -10
            echo "== __NEXT_DATA__ ou self.__next_f (zqx) =="
            grep -oE '(__NEXT_DATA__|self\.__next_f\.push)[^<]{0,400}' pag3.html | head -10
            echo "== diff bruto entre kkk e zqx (linhas unicas de cada, ate 40) =="
            diff <(fold -w200 pag1.html) <(fold -w200 pag3.html) | head -80
          } > "$GITHUB_WORKSPACE/nicks_diagnostico_html.txt" 2>&1 || true
          mkdir -p "$GITHUB_WORKSPACE/nicks"
          cp "$GITHUB_WORKSPACE/nicks_diagnostico_html.txt" "$GITHUB_WORKSPACE/nicks/diagnostico_html.txt"
          grep -hoE '(src|href)="[^"]+\.m?js[^"]*"' pag*.html 2>/dev/null | sed -E 's/^(src|href)="//; s/"$//' | sort -u | head -12 > bundles.txt
          echo "== bundles =="; cat bundles.txt
          i=0
          while read -r b; do
            i=$((i+1))
            case "$b" in http*) url="$b";; /*) url="https://hytale.tools$b";; *) url="https://hytale.tools/$b";; esac
            curl -sSL -A "$UA" --max-time 25 "$url" -o "b$i.js"
          done < bundles.txt
          { grep -hoE 'https?://[A-Za-z0-9._-]+/[A-Za-z0-9._/{}?=&%-]*' pag*.html b*.js 2>/dev/null
            grep -hoE '"/api/[A-Za-z0-9._/{}?=&%-]*"' pag*.html b*.js 2>/dev/null | tr -d '"' | sed 's|^|https://hytale.tools|'
          } | sort -u > brutas.txt
          grep -iE 'api|avail|check|username|player|search|account|name' brutas.txt | head -60 > "$GITHUB_WORKSPACE/sonda_urls.txt"
          pip download hytale-api --no-deps -d pkg -q
          ( cd pkg 2>/dev/null && for f in *; do case "$f" in *.whl|*.zip) unzip -oq "$f" -d x;; *.tar.gz) tar xzf "$f";; esac; done )
          echo "== urls no pacote hytale-api =="
          grep -rhoIE 'https?://[A-Za-z0-9._/{}-]+' pkg 2>/dev/null | sort -u | head -40 | tee -a "$GITHUB_WORKSPACE/sonda_urls.txt"
          echo "== trechos de disponibilidade no pacote =="
          grep -rniIE 'avail|reserv' pkg 2>/dev/null | grep -vE '\.dist-info|METADATA|RECORD' | head -40
          git clone --depth 1 https://github.com/hytale-tools/api repo_api 2>/dev/null
          echo "== urls no repo hytale-tools/api =="
          grep -rhoIE 'https?://[A-Za-z0-9._/{}-]+' repo_api 2>/dev/null | sort -u | head -60 | tee -a "$GITHUB_WORKSPACE/sonda_urls.txt"
          echo "== rotas/handlers no repo =="
          grep -rniIE 'route|handler|avail|reserv' repo_api 2>/dev/null | grep -iE 'user|name|avail|search|check|reserv' | head -60
          echo "== sonda_urls.txt final =="
          sort -u "$GITHUB_WORKSPACE/sonda_urls.txt" -o "$GITHUB_WORKSPACE/sonda_urls.txt"
          cat "$GITHUB_WORKSPACE/sonda_urls.txt"
          mkdir -p "$GITHUB_WORKSPACE/nicks"
          head -80 "$GITHUB_WORKSPACE/sonda_urls.txt" > "$GITHUB_WORKSPACE/nicks/diagnostico_sonda.txt"
          exit 0

      # A pagina usa TanStack Start (server functions/RPC): a checagem de
      # disponibilidade so acontece depois de hidratar no navegador, entao
      # nao da pra ver so lendo o HTML inicial (a sonda anterior confirmou
      # isso). Abre num Chromium headless de verdade e grava toda chamada
      # de rede que a pagina faz, pra achar o endpoint real.
      - name: Sondar rede com navegador
        run: |
          set +e
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node sonda_rede.js > nicks/diagnostico_rede.txt 2>&1
          echo "== diagnostico_rede.txt =="
          cat nicks/diagnostico_rede.txt
          exit 0

      - name: Qualificar fonte e varrer
        env:
          CHARSET: ${{ inputs.charset }}
          MAX_RPS: ${{ inputs.max_rps }}
        run: node verifica_nicks_hytale.js

      # if always: em falha de qualificacao o diagnostico.md ainda e comitado,
      # dai o resultado (bom ou ruim) sempre chega pelo proprio branch.
      - name: Gravar resultado no branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add nicks
          if git diff --cached --quiet; then echo 'nada pra gravar'; exit 0; fi
          git commit -m "resultado v2: nicks de 3 caracteres do Hytale (${{ inputs.charset || 'letras+numeros' }})"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
